<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Integrated terminal — substantial project listing">
  <defs>
    <filter id="term-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#term-shadow)">
    <rect x="40" y="20" width="1120" height="460" rx="14" fill="#0d0e14"/>
    <rect x="40" y="20" width="1120" height="34" rx="14" fill="#1c1f2e"/>
    <rect x="40" y="38" width="1120" height="16" fill="#1c1f2e"/>
    <line x1="40" y1="54" x2="1160" y2="54" stroke="#05060a" stroke-width="0.6"/>
  </g>

  <circle cx="64" cy="37" r="5.5" fill="#ff5f56"/>
  <circle cx="84" cy="37" r="5.5" fill="#ffbd2e"/>
  <circle cx="104" cy="37" r="5.5" fill="#27c93f"/>
  <text x="600" y="41" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#7a7f99" letter-spacing="2">TERMINAL — zsh</text>

  <g font-family="'JetBrains Mono', monospace" font-size="13">
    <text x="60" y="82" fill="#a78bfa">tanishk@studio</text><text x="182" y="82" fill="#7a7f99">:</text><text x="188" y="82" fill="#71d69c">~/projects</text><text x="270" y="82" fill="#7a7f99">$</text><text x="282" y="82" fill="#d7e0ec">ls -la --sort=scope</text>

