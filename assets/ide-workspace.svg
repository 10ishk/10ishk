<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Tanishk Bhardwaj IDE workspace</title><desc id="desc">An animated code editor workspace showing computer vision, applied AI, software, and project files.</desc><style>.bg{fill:#090d14}.panel{fill:#0e141e;stroke:#263140}.bar{fill:#121a25}.grid{stroke:#182230}.stroke{fill:none;stroke:#344355}.muted{fill:#718096}.text{fill:#dce6f2}.blue{fill:#69b8ff}.purple{fill:#b79aff}.green{fill:#71d69c}.yellow{fill:#e7c477}.orange{fill:#f0a273}.line{stroke:#69b8ff}.pulse{animation:pulse 2.8s ease-in-out infinite}.pulse2{animation:pulse 2.8s ease-in-out -1.4s infinite}.caret{animation:blink 1.1s steps(1,end) infinite}.scan{animation:scan 5s ease-in-out infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.45)}}@keyframes scan{0%,100%{opacity:0;transform:translateY(0)}20%,75%{opacity:.45}90%{opacity:0;transform:translateY(250px)}}@media(prefers-color-scheme:light){.bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#d7dee8}.bar{fill:#eef2f7}.grid{stroke:#e8edf3}.stroke{stroke:#aab6c5}.muted{fill:#64748b}.text{fill:#1e293b}.blue{fill:#1d72c7}.purple{fill:#7655c7}.green{fill:#21844e}.yellow{fill:#946c12}.orange{fill:#b45309}.line{stroke:#1d72c7}}@media(prefers-reduced-motion:reduce){.pulse,.pulse2,.caret,.scan{animation:none}}</style><rect width="1200" height="520" rx="12" class="bg"/><path d="M0 70h1200M0 120h1200M0 170h1200M0 220h1200M0 270h1200M0 320h1200M0 370h1200M0 420h1200M0 470h1200" class="grid"/><path d="M30 0v520M90 0v520M150 0v520M210 0v520M270 0v520M330 0v520M390 0v520M450 0v520M510 0v520M570 0v520M630 0v520M690 0v520M750 0v520M810 0v520M870 0v520M930 0v520M990 0v520M1050 0v520M1110 0v520M1170 0v520" class="grid"/><rect x="18" y="18" width="1164" height="34" rx="8" class="bar"/><circle cx="38" cy="35" r="5" fill="#f05f57"/><circle cx="56" cy="35" r="5" fill="#e7bd45"/><