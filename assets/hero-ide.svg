    <circle cx="72" cy="228" r="3" fill="#58a6ff"/>
    <text x="82" y="232" fill="#9aa0b8">ak680_studio.rs</text>
  </g>

  <line x1="52" y1="256" x2="248" y2="256" stroke="#22263a" stroke-width="0.6"/>
  <g font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#5a5f7a" letter-spacing="1.5">
    <text x="60" y="278">FOCUS</text>
  </g>
  <text x="58" y="300" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#9aa0b8">computer vision · applied AI</text>
  <text x="58" y="318" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#9aa0b8">operations · hardware</text>

  <!-- Tabs -->
  <rect x="260" y="68" width="900" height="32" fill="#161822"/>
  <line x1="260" y1="100" x2="1160" y2="100" stroke="#22263a" stroke-width="0.6"/>

  <g font-family="'JetBrains Mono', monospace" font-size="11.5">
    <rect x="260" y="68" width="150" height="32" fill="#0d0e14"/>
    <circle cx="278" cy="84" r="3" fill="#f4d35e"/>
    <text x="288" y="88" fill="#e8e8e8">intro.md</text>
    <rect x="260" y="68" width="150" height="2" fill="#5b8def"/>

    <rect x="410" y="68" width="130" height="32" fill="#161822"/>
    <circle cx="428" cy="84" r="3" fill="#f4d35e"/>
    <text x="438" y="88" fill="#7a7f99">movi_agent.py</text>

    <rect x="540" y="68" width="110" height="32" fill="#161822"/>
    <circle cx="558" cy="84" r="3" fill="#58a6ff"/>
    <text x="568" y="88" fill="#7a7f99">signals.svg</text>
  </g>

  <!-- Editor pane -->
  <rect x="260" y="100" width="900" height="490" fill="#0d0e14"/>

  <g font-family="'JetBrains Mono', monospace">
    <text x="304" y="140" fill="#6a7485" font-size="12"># intro.md</text>
    <rect x="318" y="166" width="770" height="270" rx="9" fill="#111722" stroke="#273447"/>
    <rect x="346" y="296" width="720" height="30" rx="3" fill="#223555" opacity="0">
      <animate attributeName="opacity" values="0;0.32;0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="362" y="277" width="0" height="2" fill="#69b8ff" opacity="0.8">
      <animate attributeName="width" values="0;660;0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="362" y="226" fill="#e8e8e8" font-size="28" font-weight="600">Tanishk Bhardwaj<animate attributeName="opacity" values="1;0.72;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="364" y="258" fill="#69b8ff" font-size="13">computer vision · applied AI · software<animate attributeName="opacity" values="1;0.55;1" dur="6s" begin="0.4s" repeatCount="indefinite"/></text>
    <path d="M362 280h660" stroke="#2c3b4d"/>
    <text x="362" y="318" fill="#d7e0ec" font-size="13">Applied systems across video, voice, operations, and hardware.<animate attributeName="opacity" values="1;0.7;1" dur="6s" begin="0.8s" repeatCount="indefinite"/></text>
    <text x="362" y="346" fill="#94a3b8" font-size="12">Building useful workflows around imperfect inputs.<animate attributeName="opacity" values="1;0.65;1" dur="6s" begin="1.2s" repeatCount="indefinite"/></text>
    <text x="362" y="392" fill="#71d69c" font-size="12">● focused on work that can be inspected<animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/></text>
    <rect x="362" y="414" width="8" height="15" fill="#71d69c"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Minimap -->
  <rect x="1130" y="100" width="30" height="490" fill="#0a0b10"/>
  <g fill="#2a2e44">
    <rect x="1136" y="130" width="18" height="2"/>
    <rect x="1136" y="140" width="14" height="2"/>
    <rect x="1136" y="150" width="16" height="2"/>
    <rect x="1136" y="164" width="12" height="2"/>
    <rect x="1136" y="174" width="18" height="2"/>
    <rect x="1136" y="188" width="10" height="2"/>
    <rect x="1136" y="198" width="16" height="2"/>
    <rect x="1136" y="212" width="14" height="2"/>
    <rect x="1136" y="222" width="18" height="2"/>
    <rect x="1136" y="236" width="12" height="2"/>
  </g>
  <rect x="1132" y="126" width="26" height="26" fill="#3a3f56" opacity="0.4"/>

  <!-- Status bar -->
  <rect x="40" y="562" width="1120" height="28" rx="0" fill="#2f3470"/>
  <rect x="40" y="576" width="1120" height="14" fill="#2f3470"/>
  <path d="M0,0" />
  <g font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#e6e8f5">
    <path d="M 60 570 v 12 M 60 570 q 6 0 6 6 q 0 6 -6 6" fill="none" stroke="#e6e8f5" stroke-width="1.2"/>
    <text x="78" y="580">main</text>
    <text x="130" y="580" fill="#c3c7ee">Python · TypeScript · Rust</text>
    <text x="210" y="580" fill="#c3c7ee">UTF-8</text>
    <text x="1000" y="580" fill="#c3c7ee">Ln 4, Col 18</text>
    <circle cx="1108" cy="576" r="3.5" fill="#5fd08a">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1118" y="580" fill="#c3c7ee">ready</text>
  </g>
</svg>
