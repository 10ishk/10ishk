    <text x="304" y="140" opacity="0">
      <tspan fill="#c77dff">const</tspan><tspan fill="#5b8def"> tanishk</tspan><tspan fill="#e8e8e8"> = {</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.03;0.08;0.85;0.93;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="304" y="164" opacity="0">
      <tspan fill="#5b8def">  name</tspan><tspan fill="#e8e8e8">: </tspan><tspan fill="#5fd08a">"Tanishk Bhardwaj"</tspan><tspan fill="#e8e8e8">,</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.13;0.18;0.85;0.93;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="304" y="188" opacity="0">
      <tspan fill="#5b8def">  focus</tspan><tspan fill="#e8e8e8">: [</tspan><tspan fill="#e7c477">"computer vision"</tspan><tspan fill="#e8e8e8">,</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.26;0.31;0.85;0.93;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="304" y="212" opacity="0">
      <tspan fill="#e8e8e8">          </tspan><tspan fill="#e7c477">"applied AI"</tspan><tspan fill="#e8e8e8">, </tspan><tspan fill="#e7c477">"software"</tspan><tspan fill="#e8e8e8">],</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.39;0.44;0.85;0.93;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="304" y="236" opacity="0">
      <tspan fill="#5b8def">  principle</tspan><tspan fill="#e8e8e8">: </tspan><tspan fill="#f0a273">"ask before acting"</tspan><tspan fill="#e8e8e8">,</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.52;0.57;0.85;0.93;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="304" y="270" opacity="0">
      <tspan fill="#5b8def">  builds</tspan><tspan fill="#e8e8e8">: [</tspan><tspan fill="#71d69c">"operations"</tspan><tspan fill="#e8e8e8">, </tspan><tspan fill="#71d69c">"hardware"</tspan><tspan fill="#e8e8e8">]</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.66;0.72;0.85;0.93;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="304" y="294" fill="#e8e8e8">};</text>

    <rect x="304" y="126" width="7" height="14" fill="#5fd08a">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y"
        values="126;126;150;150;174;174;198;198;222;222;250;250;126"
        keyTimes="0;0.03;0.13;0.26;0.39;0.52;0.66;0.72;0.85;0.9;0.93;0.96;1"
        dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

