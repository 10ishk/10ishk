<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Tanishk Bhardwaj — IDE view">
  <defs>
    <linearGradient id="ide-stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1238"/>
      <stop offset="1" stop-color="#0d0820"/>
    </linearGradient>
    <filter id="ide-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="statusPulsePath" d="M 0 0" />
  </defs>

  <rect width="1200" height="640" fill="url(#ide-stage)"/>

  <!-- Window -->
  <g filter="url(#ide-shadow)">
    <rect x="40" y="30" width="1120" height="560" rx="14" fill="#0d0e14"/>
    <!-- Title bar -->
    <rect x="40" y="30" width="1120" height="38" rx="14" fill="#1c1f2e"/>
    <rect x="40" y="50" width="1120" height="18" fill="#1c1f2e"/>
    <line x1="40" y1="68" x2="1160" y2="68" stroke="#05060a" stroke-width="0.6"/>
  </g>

  <circle cx="66" cy="49" r="6.5" fill="#ff5f56"/>
  <circle cx="88" cy="49" r="6.5" fill="#ffbd2e"/>
