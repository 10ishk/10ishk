<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Tanishk Bhardwaj — IDE view">
  <defs>
    <linearGradient id="ide-stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1238"/>
      <stop offset="1" stop-color="#0d0820"/>
    </linearGradient>
    <filter id="ide-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="statusPulsePath" d="M 0 0" />
  </defs>

  <rect width="1200" height="640" fill="url(#ide-stage)"/>

  <!-- Window -->
  <g filter="url(#ide-shadow)">
    <rect x="40" y="30" width="1120" height="560" rx="14" fill="#0d0e14"/>
    <!-- Title bar -->
    <rect x="40" y="30" width="1120" height="38" rx="14" fill="#1c1f2e"/>
    <rect x="40" y="50" width="1120" height="18" fill="#1c1f2e"/>
    <line x1="40" y1="68" x2="1160" y2="68" stroke="#05060a" stroke-width="0.6"/>
  </g>

  <circle cx="66" cy="49" r="6.5" fill="#ff5f56"/>
  <circle cx="88" cy="49" r="6.5" fill="#ffbd2e"/>
  <circle cx="110" cy="49" r="6.5" fill="#27c93f"/>
  <text x="600" y="53" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7a7f99" letter-spacing="2">10ishk / profile — Code</text>

  <!-- Sidebar -->
  <rect x="40" y="68" width="220" height="522" fill="#11131c"/>
  <line x1="260" y1="68" x2="260" y2="590" stroke="#22263a" stroke-width="1"/>

  <g font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#5a5f7a" letter-spacing="1.5">
    <text x="60" y="92">EXPLORER</text>
  </g>
  <text x="58" y="116" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a78bfa">▾ 10ishk</text>

  <!-- file list -->
  <g font-family="'JetBrains Mono', monospace" font-size="12">
    <rect x="52" y="130" width="196" height="20" fill="#1e2a44"/>
    <circle cx="72" cy="140" r="3" fill="#f4d35e"/>
    <text x="82" y="144" fill="#e8e8e8">profile.tsx</text>

    <circle cx="72" cy="162" r="3" fill="#f4d35e"/>
    <text x="82" y="166" fill="#9aa0b8">movi_agent.py</text>

    <circle cx="72" cy="184" r="3" fill="#f4d35e"/>
    <text x="82" y="188" fill="#9aa0b8">yardvision.py</text>

    <circle cx="72" cy="206" r="3" fill="#ff8a5b"/>
