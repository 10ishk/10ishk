<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Signals through a processing system</title><desc id="desc">Abstract visual, temporal, audio and data signals pass through a geometric system and become events and actions.</desc><style>.line{fill:none;stroke:#5c6675;stroke-width:1.5}.soft{stroke:#303846}.accent{stroke:#65b7ff}.violet{stroke:#a98cff}.node{fill:#0d1117;stroke:#8190a5;stroke-width:1.5}.dot{fill:#65b7ff}@media(prefers-color-scheme:light){.node{fill:#fff}.line{stroke:#9aa5b5}.soft{stroke:#d8dee8}.accent{stroke:#1677c8}.violet{stroke:#7655c7}}@media(prefers-reduced-motion:reduce){.pulse{animation:none!important}}.pulse{animation:drift 7s linear infinite}.pulse:nth-child(2){animation-delay:-2.2s}.pulse:nth-child(3){animation-delay:-4.5s}@keyframes drift{0%{transform:translateX(0);opacity:.1}18%{opacity:1}75%{opacity:1}100%{transform:translateX(390px);opacity:0}}</style><rect width="1200" height="360" rx="8" fill="#0d1117"/><g opacity=".45" class="soft"><path d="M0 60h1200M0 120h1200M0 180h1200M0 240h1200M0 300h1200"/><path d="M80 0v360M180 0v360M280 0v360M380 0v360M480 0v360M580 0v360M680 0v360M780 0v360M880 0v360M980 0v360M1080 0v360"/></g><g class="line"><path d="M40 104l150 0 70 76M40 180h150l70 0M40 256l150 0 70-76"/><path d="M40 92v24m14-24v24m14-24v24M78 184c10-32 20 32 30 0s20 32 30 0 20 32 30 0M83 236h28m-23 8h18m-13 8h8"/></g><g class="node"><rect x="260" y="78" width="250" height="204" rx="6"/><path d="M300 120h170M300 150h120M300 180h150M300 210h88M300 240h130" class="soft"/><circle cx="300" cy="120" r="3" class="dot"/><circle cx="420" cy="150" r="3" class="violet"/><circle cx="388" cy="210" r="3" class="dot"/></g><g class="line"><path d="M510 116l115 64-115 64M625 180h170M795 180l105-76m-105 76 105 0m-105 0 105 76" class="accent"/><path d="M900 104h250m-250 76h250m-250 76h250M1130 96l20 8-20 8m0 60 20 8-20 8m0 60 20 8-20 8" class="violet"/></g><g class="pulse"><circle cx="70"