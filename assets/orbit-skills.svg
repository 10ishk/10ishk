      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="600" cy="270" r="210" fill="none" stroke="#262b42" stroke-width="1" stroke-dasharray="2,6"/>
