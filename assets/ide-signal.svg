<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc"><title id="title">Project signal map</title><desc id="desc">A compact IDE-style map of four projects and the signals they handle.</desc><style>.bg{fill:#0e141e;stroke:#263140}.grid{stroke:#1d2a39}.text{fill:#dce6f2}.muted{fill:#718096}.blue{stroke:#69b8ff}.green{stroke:#71d69c}.purple{stroke:#b79aff}.orange{stroke:#f0a273}.dot{animation:dot 3s ease-in-out infinite}.dot2{animation:dot 3s ease-in-out -1.5s infinite}@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}@media(prefers-color-scheme:light){.bg{fill:#fff;stroke:#d7dee8}.grid{stroke:#e8edf3}.text{fill:#1e293b}.muted{fill:#64748b}.blue{stroke:#1d72c7}.green{stroke:#21844e}.purple{stroke:#7655c7}.orange{stroke:#b45309}}@media(prefers-reduced-motion:reduce){.dot,.dot2{animation:none}}</style><rect width="1200" height="190" rx="8" class="bg"/><path d="M0 48h1200M0 96h1200M0 144h1200M240 0v190M480 0v190M720 0v190M960 0v190" class="grid"/><text x="28" y="30" class="muted" font-family="monospace" font-size="11">workspace / signal map</text><g font-family="monospace" font-size="11"><text x="28" y="76" class="text">movi-agent</text><text x="28" y="124" class="text">yardvision</text><text x="28" y="172" class="text">voice-lead-agent</text><text x="850" y="172" class="text">ak680-studio</text></g><g fill="none" stroke-width="1.5"><path d="M164 72h186l72 24h150l70-24h120" class="blue"/><path d="M164 120h96l74-24h110l72 24h160" class="green"/><path d="M164 168h174l70-72h120l70 72h170" class="purple"/><path d="M850 168h-80l-72-72" class="orange"/></g><g fill="#0e141e" stroke-width="1.5"><circle cx="350" cy="72" r="4" class="blue dot"/><circle cx="572" cy="72" r="4" class="blue dot2"/><circle cx="334" cy="120" r="4" class="green dot2"/><circle cx="598" cy="120" r="4" class="green dot"/><circle cx="408" cy="168" r="4" class="purple dot"/><circle cx="598" cy="168" r="4" class="orange dot2"/></g><text x="860" y="30" class="muted" font-family="monospace" font-size="11">4 repos / 4 signal types</text></svg>
