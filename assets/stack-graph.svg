<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Interactive stack overview</title>
  <desc id="desc">IDE-style stack overview showing languages, frontend, backend, machine learning and computer vision, and desktop technologies.</desc>
  <style>
    :root { color-scheme: dark light; }
    .window { fill: #0e141e; stroke: #263140; }
    .bar { fill: #171d29; }
    .gutter { fill: #101722; }
    .grid { stroke: #1d2a39; }
    .border { stroke: #2a3a4e; }
    .text { fill: #dce6f2; }
    .muted { fill: #718096; }
    .blue { fill: #69b8ff; stroke: #69b8ff; }
    .green { fill: #71d69c; stroke: #71d69c; }
    .purple { fill: #b79aff; stroke: #b79aff; }
    .orange { fill: #f0a273; stroke: #f0a273; }
    .yellow { fill: #f4d35e; stroke: #f4d35e; }
    .card { fill: #111a26; stroke: #2a3a4e; }
    .pill { fill: #1a2838; stroke: #30445c; }
    .trace { fill: none; stroke-width: 1.5; opacity: .55; }
    .trace path { fill: none !important; }
    .signal { animation: signal 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .signal.delay-1 { animation-delay: -1.2s; }
    .signal.delay-2 { animation-delay: -2.4s; }
    .module { animation: module 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .module.delay-1 { animation-delay: -1.2s; }
    .module.delay-2 { animation-delay: -2.4s; }
    .module.delay-3 { animation-delay: -3.6s; }
    .module.delay-4 { animation-delay: -4.8s; }
    @keyframes signal { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.35); } }
    @keyframes module { 0%,100% { stroke: #2a3a4e; } 50% { stroke: #466b91; } }
    @media (prefers-color-scheme: light) {
      .window { fill: #ffffff; stroke: #d7dee8; }
      .bar { fill: #f3f6fa; }
      .gutter { fill: #f8fafc; }
      .grid { stroke: #e8edf3; }
      .border { stroke: #d7dee8; }
      .text { fill: #1e293b; }
      .muted { fill: #64748b; }
      .blue { fill: #1d72c7; stroke: #1d72c7; }
      .green { fill: #21844e; stroke: #21844e; }
      .purple { fill: #7655c7; stroke: #7655c7; }
      .orange { fill: #b45309; stroke: #b45309; }
      .yellow { fill: #a16207; stroke: #a16207; }
      .card { fill: #f8fafc; stroke: #d7dee8; }
      .pill { fill: #eef4fa; stroke: #cbd8e6; }
      @keyframes module { 0%,100% { stroke: #d7dee8; } 50% { stroke: #9eb9d3; } }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal, .module { animation: none; }
    }
  </style>

  <rect x="8" y="8" width="1184" height="374" rx="12" class="window"/>
  <rect x="8" y="8" width="1184" height="38" rx="12" class="bar"/>
  <rect x="8" y="28" width="1184" height="18" class="bar"/>
  <circle cx="31" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="73" cy="27" r="6" fill="#27c93f"/>
  <text x="104" y="31" class="muted" font-family="monospace" font-size="11" letter-spacing="1.5">10ishk / stack.json</text>
  <text x="1162" y="31" text-anchor="end" class="muted" font-family="monospace" font-size="10">5 modules · 14 tools</text>

  <rect x="8" y="46" width="54" height="336" class="gutter"/>
  <path d="M62 46v336M62 112h1130M62 236h1130" class="grid"/>
  <g class="muted" font-family="monospace" font-size="10" text-anchor="end">
    <text x="48" y="82">01</text><text x="48" y="106">02</text><text x="48" y="130">03</text><text x="48" y="154">04</text>
    <text x="48" y="178">05</text><text x="48" y="202">06</text><text x="48" y="226">07</text><text x="48" y="260">08</text>
    <text x="48" y="284">09</text><text x="48" y="308">10</text><text x="48" y="332">11</text><text x="48" y="356">12</text>
  </g>

  <g font-family="monospace">
    <text x="88" y="82" class="muted" font-size="11">{</text>
    <text x="104" y="106" class="blue" font-size="11">"runtime"</text>
    <text x="176" y="106" class="muted" font-size="11">: stack,</text>
  </g>

  <g fill="none" class="trace">
    <path d="M112 126h40v48h50" class="blue"/>
    <path d="M112 126h40v-48h50" class="green"/>
    <path d="M112 126h40v124h50" class="purple"/>
    <path d="M112 126h40v172h50" class="orange"/>
    <path d="M112 126h40v220h50" class="yellow"/>
  </g>
  <circle cx="112" cy="126" r="4" class="blue signal"/>

  <g font-family="monospace">
    <g class="module">
      <rect x="202" y="58" width="194" height="140" rx="8" class="card"/>
      <circle cx="222" cy="82" r="4" class="green"/><text x="236" y="86" class="text" font-size="12">languages</text>
      <rect x="220" y="104" width="72" height="26" rx="13" class="pill"/><text x="256" y="121" text-anchor="middle" class="text" font-size="11">Python</text>
      <rect x="300" y="104" width="78" height="26" rx="13" class="pill"/><text x="339" y="121" text-anchor="middle" class="text" font-size="11">TypeScript</text>
      <rect x="220" y="140" width="58" height="26" rx="13" class="pill"/><text x="249" y="157" text-anchor="middle" class="text" font-size="11">Rust</text>
      <text x="220" y="185" class="muted" font-size="9">core building blocks</text>
    </g>

    <g class="module delay-1">
      <rect x="416" y="58" width="194" height="140" rx="8" class="card"/>
      <circle cx="436" cy="82" r="4" class="blue"/><text x="450" y="86" class="text" font-size="12">frontend</text>
      <rect x="434" y="104" width="62" height="26" rx="13" class="pill"/><text x="465" y="121" text-anchor="middle" class="text" font-size="11">React</text>
      <text x="434" y="157" class="muted" font-size="9">interfaces that stay close</text>
      <text x="434" y="174" class="muted" font-size="9">to the workflow</text>
    </g>

    <g class="module delay-2">
      <rect x="630" y="58" width="194" height="140" rx="8" class="card"/>
      <circle cx="650" cy="82" r="4" class="purple"/><text x="664" y="86" class="text" font-size="12">backend</text>
      <rect x="648" y="104" width="76" height="26" rx="13" class="pill"/><text x="686" y="121" text-anchor="middle" class="text" font-size="11">FastAPI</text>
      <rect x="730" y="104" width="66" height="26" rx="13" class="pill"/><text x="763" y="121" text-anchor="middle" class="text" font-size="11">Express</text>
      <rect x="648" y="140" width="62" height="26" rx="13" class="pill"/><text x="679" y="157" text-anchor="middle" class="text" font-size="11">SQLite</text>
      <text x="648" y="185" class="muted" font-size="9">services + durable state</text>
    </g>

    <g class="module delay-3">
      <rect x="202" y="250" width="272" height="116" rx="8" class="card"/>
      <circle cx="222" cy="274" r="4" class="orange"/><text x="236" y="278" class="text" font-size="12">ml / computer vision</text>
      <rect x="220" y="296" width="72" height="26" rx="13" class="pill"/><text x="256" y="313" text-anchor="middle" class="text" font-size="11">PyTorch</text>
      <rect x="300" y="296" width="72" height="26" rx="13" class="pill"/><text x="336" y="313" text-anchor="middle" class="text" font-size="11">OpenCV</text>
      <rect x="380" y="296" width="72" height="26" rx="13" class="pill"/><text x="416" y="313" text-anchor="middle" class="text" font-size="11">YOLOv8</text>
      <text x="220" y="345" class="muted" font-size="9">video → evidence → action</text>
    </g>

    <g class="module delay-4">
      <rect x="494" y="250" width="194" height="116" rx="8" class="card"/>
      <circle cx="514" cy="274" r="4" class="yellow"/><text x="528" y="278" class="text" font-size="12">desktop</text>
      <rect x="512" y="296" width="58" height="26" rx="13" class="pill"/><text x="541" y="313" text-anchor="middle" class="text" font-size="11">Tauri</text>
      <text x="512" y="345" class="muted" font-size="9">native where it matters</text>
    </g>
  </g>

  <g font-family="monospace" font-size="10">
    <text x="742" y="274" class="muted">// inputs are messy</text>
    <text x="742" y="294" class="muted">// systems should be clear</text>
    <circle cx="730" cy="314" r="4" class="green signal delay-1"/>
    <path d="M742 314h250" class="border" stroke-dasharray="3 5"/>
    <text x="1010" y="318" class="green">ready</text>
    <text x="742" y="346" class="muted">}</text>
  </g>
</svg>
