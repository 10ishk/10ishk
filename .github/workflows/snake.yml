name: Generate Petrol and Copper flight log

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
      - design/boarding-pass-petrol-copper
    paths:
      - .github/workflows/snake.yml
      - scripts/build_flight_log.py

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate flight log from GitHub contributions
        run: python scripts/build_flight_log.py --user 10ishk --output dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-petrol-copper
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
