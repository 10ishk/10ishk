name: Generate boarding-pass contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
      - design/boarding-pass-readme
    paths:
      - .github/workflows/snake.yml
      - scripts/style_snake.py

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: 10ishk
          outputs: |
            dist/snake.svg?color_snake=%23e5372b&color_dots=%23e4dfd3,%23d1c29e,%23b6a069,%23877440,%23594a27
            dist/snake-dark.svg?color_snake=%23f6d77a&color_dots=%233b3731,%235b564b,%237c7566,%23a59c88,%23d2c8b4

      - name: Add themed panels and visible cell outlines
        run: python scripts/style_snake.py dist styled

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-boarding
          build_dir: styled
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
